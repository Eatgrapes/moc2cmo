[package]
name = "moc2cmo"
version = "0.1.0"
edition = "2024"
authors = ["Eatgrapes <Eatgrapesem232@qq.com>"]
description = "A fast, caller-friendly Rust library for decompiling Cubism .moc3 models into readable .cmo3 projects"
license = "MIT"
repository = "https://github.com/Eatgrapes/moc2cmo"
keywords = ["live2d", "cubism", "moc3", "cmo3", "decompiler"]
categories = ["parser-implementations", "multimedia"]

[dependencies]
crc32fast = "1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
